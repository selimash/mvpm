<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MVPM</title>
<style>
  body { margin: 0; overflow: hidden; background: #87CEEB; }
  canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x87CEEB, 100, 800);
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 2000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Rolling hilly ground using a plane with displaced vertices
  const groundGeo = new THREE.PlaneGeometry(2000, 2000, 100, 100);
  groundGeo.rotateX(-Math.PI / 2);
  const posAttr = groundGeo.attributes.position;
  for (let i = 0; i < posAttr.count; i++) {
    const x = posAttr.getX(i);
    const z = posAttr.getZ(i);
    const y = Math.sin(x * 0.01) * 8 + Math.cos(z * 0.015) * 8;
    posAttr.setY(i, y);
  }
  groundGeo.computeVertexNormals();
  const ground = new THREE.Mesh(
    groundGeo,
    new THREE.MeshStandardMaterial({ color: 0x3a9d3a })
  );
  scene.add(ground);

  // Grid helper on top for visual motion reference
  const grid = new THREE.GridHelper(2000, 100, 0x225522, 0x225522);
  grid.position.y = 0.1;
  scene.add(grid);

  // Simple city blocks scattered around (placeholder buildings)
  const buildingMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
  for (let i = 0; i < 40; i++) {
    const w = 5 + Math.random() * 10;
    const h = 10 + Math.random() * 60;
    const d = 5 + Math.random() * 10;
    const building = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), buildingMat);
    const x = (Math.random() - 0.5) * 600;
    const z = (Math.random() - 0.5) * 600;
    building.position.set(x, h / 2, z);
    scene.add(building);
  }

  // Light
  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(50, 100, 50);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x888888));

  // Car
  const carBody = new THREE.Mesh(
    new THREE.BoxGeometry(2, 1, 4),
    new THREE.MeshStandardMaterial({ color: 0x2255ff })
  );
  const carTop = new THREE.Mesh(
    new THREE.BoxGeometry(1.4, 0.7, 2),
    new THREE.MeshStandardMaterial({ color: 0x1133cc })
  );
  carTop.position.set(0, 0.85, -0.3);
  const car = new THREE.Group();
  car.add(carBody);
  car.add(carTop);
  car.position.y = 1.5;
  scene.add(car);

  let speed = 0;
  let angle = 0;
  const keys = {};
  document.addEventListener('keydown', e => keys[e.key] = true);
  document.addEventListener('keyup', e => keys[e.key] = false);

  function animate() {
    requestAnimationFrame(animate);

    if (keys['ArrowUp']) speed = Math.min(speed + 0.01, 0.6);
    else if (keys['ArrowDown']) speed = Math.max(speed - 0.01, -0.3);
    else speed *= 0.95;

    if (keys['ArrowLeft']) angle += 0.03 * (speed !== 0 ? 1 : 0);
    if (keys['ArrowRight']) angle -= 0.03 * (speed !== 0 ? 1 : 0);

    car.rotation.y = angle;
    car.position.x += Math.sin(angle) * speed;
    car.position.z += Math.cos(angle) * speed;

    camera.position.x = car.position.x - Math.sin(angle) * 10;
    camera.position.z = car.position.z - Math.cos(angle) * 10;
    camera.position.y = car.position.y + 5;
    camera.lookAt(car.position);

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
